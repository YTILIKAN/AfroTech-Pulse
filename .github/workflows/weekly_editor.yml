name: Weekly Editor Selection

on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run editor selection and newsletter writing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m newsletter.run_writer

      - name: Sauvegarder la base de donnees
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Selection editoriale + redaction automatique du ${{ github.run_started_at }}"
          file_pattern: "afrotech.db"
