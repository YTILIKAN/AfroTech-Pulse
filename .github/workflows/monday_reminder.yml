name: Monday Reminder

# 11:00 UTC = 7h heure de l'Est (Montréal) l'été, 6h l'hiver — environ 2h avant la
# publication automatique (monday_publish.yml), le temps de valider et de push afrotech.db.
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

jobs:
  reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rappeler a l'equipe de valider la newsletter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python -m notifier
